version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: blogger-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-blogger}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-blogger_dev}
      POSTGRES_DB: ${DB_NAME:-blogger_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-blogger} -d ${DB_NAME:-blogger_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: blogger-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${DB_USER:-blogger}:${DB_PASSWORD:-blogger_dev}@db:5432/${DB_NAME:-blogger_db}
      PORT: ${PORT:-3000}
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_change_me}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${PORT:-3000}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:

</content>